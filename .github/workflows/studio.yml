name: Core-aura verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify phone screens and offline audio
        run: |
          python3 -m http.server 8089 --directory dist &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8089/health.json
          CORE_AURA_URL=http://localhost:8089 bash ops/verify.sh 0.10.0
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification
          path: mobile-verification/
      - uses: actions/upload-artifact@v4
        with:
          name: core-aura-web
          path: dist/
  backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: core_aura_test
          POSTGRES_USER: core_aura
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_aura -d core_aura_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://core_aura:test-password@127.0.0.1:5432/core_aura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt httpx==0.28.1
      - name: Verify migrations and content publication
        working-directory: backend
        run: |
          alembic upgrade head
          alembic upgrade head
          python -m unittest test_catalog
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: bash android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: core-aura-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/core-aura-ios CODE_SIGNING_ALLOWED=NO build
