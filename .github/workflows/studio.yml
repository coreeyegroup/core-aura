name: Core-aura verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Verify phone screens, offline audio and administration
        env:
          DATABASE_URL: sqlite:////tmp/core-aura-admin-test.db
          CORE_AURA_CONTENT_ROOT: /tmp/core-aura-admin-files
          CORE_AURA_ADMIN_TOKEN: test-browser-admin
          CORE_AURA_VAPID_PUBLIC_KEY: BGsX0fLhLEJH-Lzm5WOkQPJ3A32BLeszoPShOUXYmMKWT-NC4v4af5uO5-tKfA-eFivOM1drMV7Oy7ZAaDe_UfU
          CORE_AURA_PUBLIC_ORIGIN: http://localhost:8089
          CORE_AURA_API_PROXY: http://127.0.0.1:8090
        run: |
          (cd backend && alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8090) &
          backend=$!
          npx vite preview --port 8089 &
          server=$!
          trap 'kill "$server" "$backend"' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8090/api/health
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8089/health.json
          CORE_AURA_URL=http://localhost:8089 bash ops/verify.sh 0.34.0
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-verification
          path: mobile-verification/
      - uses: actions/upload-artifact@v4
        with:
          name: core-aura-web
          path: dist/
  backend:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: core_aura_test
          POSTGRES_USER: core_aura
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_aura -d core_aura_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://core_aura:test-password@127.0.0.1:5432/core_aura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt httpx==0.28.1
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Verify migrations and content publication
        working-directory: backend
        run: |
          alembic upgrade head
          alembic upgrade head
          python -m unittest test_catalog test_reminders test_speech test_admin_roles
      - name: Verify content volume persistence and non-root image
        run: python tests/container-smoke.py
      - name: Validate Android download routes
        run: |
          python3 tests/site_config_test.py
          docker run --rm -v "$PWD/ops/core-aura.caddy:/etc/caddy/Caddyfile:ro" caddy:2.9.1-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -v "$PWD/ops/core-aura-with-api.caddy:/etc/caddy/Caddyfile:ro" caddy:2.9.1-alpine caddy validate --config /etc/caddy/Caddyfile
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: bash android/gradlew -p android assembleDebug assembleRelease testDebugUnitTest
      - name: Prepare unsigned Android release inputs
        run: |
          git diff --exit-code -- android
          python3 scripts/android_inputs.py --apk android/app/build/outputs/apk/release/app-release-unsigned.apk --tools "$ANDROID_HOME/build-tools/35.0.0" --output android-publish-inputs
      - name: Verify permanent signing and atomic publication
        run: python3 tests/android_publication.py android-publish-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: core-aura-android-publish-inputs
          path: android-publish-inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: core-aura-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/core-aura-ios CODE_SIGNING_ALLOWED=NO build
      - run: plutil -lint /tmp/core-aura-ios/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy

  android-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, backend, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-aura-android-publish-inputs
          path: android-publish-inputs
      - name: Publish immutable unsigned release inputs
        working-directory: android-publish-inputs
        run: |
          version=$(python3 -c 'import json;print(json.load(open("publish-inputs.json"))["versionName"])')
          tag="android-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --pattern publish-inputs.json --dir existing
            python3 -c 'import json; a=json.load(open("publish-inputs.json")); b=json.load(open("existing/publish-inputs.json")); assert a["sourceDigest"]==b["sourceDigest"] and a["versionCode"]==b["versionCode"], "Native code changed: increase app version and versionCode before publishing"'
            echo "This Android release is already published. Existing assets were preserved."
          else
            cat > release-notes.md <<'NOTES'
          Unsigned Android build inputs for VPS-owned signing. These are not installable APK downloads.
          Run ops/publish-android.sh from the matching checkout to sign and publish the app at core-aura.coreeye.in.
          The private signing identity stays on the VPS and is never uploaded to GitHub.
          NOTES
            gh release create "$tag" --target "$GITHUB_SHA" --title "Core-aura Android $version — build inputs" --notes-file release-notes.md --prerelease publish-inputs.json apksigner-35.0.0.jar "core-aura-$version-unsigned.apk"
          fi
